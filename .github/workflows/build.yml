name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

      - name: Build plugin
        run: ./gradlew buildPlugin

      - uses: actions/upload-artifact@v7
        with:
          name: mr-navigator
          path: build/distributions/*.zip
